:root{--navy:#10233f;--navy2:#18385d;--or:#ff6600;--ok:#10a66a;--bad:#d92736;--bg:#f3f6fb;--card:#fff;--ink:#152b4b;--mut:#71819a;--line:#e0e8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1628;--card:#122340;--ink:#e8eef8;--mut:#94a6c3;--line:#223a5e}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 80% 10%,#ff660033,transparent 40%),linear-gradient(160deg,#0c1d35,#18385d)}
.lbox{max-width:420px;width:100%;text-align:center;color:#fff}.lbox img{width:150px;filter:drop-shadow(0 10px 30px #ff660066);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.lbox h1{margin:10px 0 4px;font-size:26px}.lbox p{color:#b6c6dc;margin:0 0 24px}
.role{display:flex;gap:14px;align-items:center;width:100%;margin:10px 0;background:#ffffff14;border:1px solid #ffffff2a;color:#fff;text-align:right;backdrop-filter:blur(8px);padding:16px;transition:.2s}.role:hover{background:var(--or);transform:translateY(-2px)}.role i{font-size:28px;font-style:normal}.role small{display:block;color:#d0dcec;font-weight:400}
.app{display:none;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0c1d35,#142e50);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side .br{text-align:center;padding-bottom:18px}.side img{width:140px}.nav{display:flex;gap:10px;align-items:center;background:none;color:#dbe5f3;text-align:right;width:100%}.nav.on,.nav:hover{background:var(--or);color:#fff}.side .out{margin-top:auto;background:#ffffff14;color:#fff}
.top{background:linear-gradient(112deg,#101f38,#18385d 70%,#254b70);border-bottom:4px solid var(--or);color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}.top:before{content:"";position:absolute;left:-50px;top:-80px;width:200px;height:200px;border:22px solid #ff660026;border-radius:50%}
.top h2{margin:0;font-size:20px}.top span{color:#ffb66b;font-size:13px}.av{width:44px;height:44px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:800;position:relative}
.ct{padding:22px;max-width:1300px;margin:auto}.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 22px #10233f0d}
.kpi b{font-size:30px;display:block;margin-top:4px}.kpi span{color:var(--mut);font-size:13px}.kpi .ic{float:left;font-size:26px;background:#ff66001a;border-radius:14px;padding:8px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:24px;padding:24px;position:relative;overflow:hidden;text-align:center}.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:#ff660040}
.pulse{width:92px;height:92px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:38px;background:var(--or);box-shadow:0 0 0 0 #ff660088;animation:pu 2s infinite;position:relative;z-index:1}.pulse.in{background:var(--ok);--c:#10a66a88}@keyframes pu{70%{box-shadow:0 0 0 24px #ff660000}}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:8px 0}
.go{background:var(--or);color:#fff;width:100%;font-size:16px;position:relative;z-index:1}.go.red{background:var(--bad)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.t-ok{background:#10a66a22;color:var(--ok)}.t-no{background:#d927361a;color:var(--bad)}.t-w{background:#ff66001f;color:var(--or)}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#ffa24d);border-radius:9px;transition:.5s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.ck{display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}.ck:last-child{border:0}
.bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none;transition:.2s}.ck.on .bx{background:var(--ok);border-color:var(--ok)}.ck.on span{text-decoration:line-through;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap;padding:9px 14px;border-radius:99px}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}.ring b{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.am{cursor:pointer;transition:.2s}.am:hover{transform:translateY(-3px);border-color:var(--or)}
.bn{display:none}h3{margin:20px 0 12px}.mut{color:var(--mut);font-size:13px}.fd{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}#md>div{background:var(--bg);border-radius:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;z-index:99;transition:.4s;border-right:5px solid var(--or)}#toast.s{transform:translate(-50%,0)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.k4{grid-template-columns:1fr 1fr}.ct{padding:14px 14px 96px}.top{padding:16px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}.bn button{background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px 14px}.bn button.on{color:var(--or)}.bn i{font-style:normal;font-size:21px}}
.gh{margin:16px 0 4px;padding:6px 12px;background:#ff66001a;color:var(--or);border-radius:10px;font-weight:800;font-size:14px}.it{padding:11px 0;border-bottom:1px solid var(--line)}.tx{font-size:14px;margin-bottom:8px;line-height:1.5}
.sc{display:flex;gap:5px;direction:ltr}.sc button{flex:1;padding:8px 0;border-radius:9px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:13px}.sc .on{color:#fff;border-color:transparent}.sc .v5,.sc .v4{background:var(--ok)}.sc .v3,.sc .v2{background:var(--or)}.sc .v1,.sc .v0{background:var(--bad)}.sc .vN{background:var(--mut)}
.tl{width:46px;height:46px;object-fit:contain;margin-left:12px;background:#ffffff14;border-radius:12px;padding:3px;position:relative}.top>div:first-child{display:flex;align-items:center}.chip small{opacity:.75;margin-right:4px}
@media(min-width:861px){.tl{display:none}}.dlb{background:#ff66001a;color:var(--or);padding:7px 11px;border-radius:10px;font-size:12px}.dls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dls .dlb{flex:1;white-space:nowrap}.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.hd .dls{margin:0}</style></head><body>
